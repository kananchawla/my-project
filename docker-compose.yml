version: "3.9"

services:
  flask:
    image: flask-app:multistage
    ports:
      - "5000:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - FLASK_DEBUG=false
    restart: unless-stopped